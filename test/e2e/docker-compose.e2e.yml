services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: replay
      POSTGRES_PASSWORD: replay
      POSTGRES_DB: replay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replay"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api-gateway:
    build:
      context: ../../apps/api-gateway
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://replay:replay@postgres:5432/replay?sslmode=disable
      JWT_SECRET: e2e-secret
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ingestion:
    build:
      context: ../../apps/ingestion
    environment:
      HTTP_ADDR: ":8081"
    ports:
      - "8081:8081"

  reconstruction:
    build:
      context: ../../apps/reconstruction
    environment:
      WORKER_QUEUE_URL: redis://redis:6379
    depends_on:
      - redis

  web:
    build:
      context: ../../apps/web
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
