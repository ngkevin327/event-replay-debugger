global:
  imageRegistry: ghcr.io/replay-platform
  imagePullPolicy: IfNotPresent
  environment: staging

apiGateway:
  enabled: true
  replicaCount: 2
  image:
    repository: api-gateway
    tag: latest
  service:
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    HTTP_ADDR: ":8080"
    LOG_LEVEL: info

ingestion:
  enabled: true
  replicaCount: 2
  image:
    repository: ingestion
    tag: latest
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

reconstruction:
  enabled: true
  replicaCount: 1
  image:
    repository: reconstruction
    tag: latest
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

serviceAccount:
  create: true
  name: replay-platform

ingress:
  enabled: false
  host: staging.replay.example
