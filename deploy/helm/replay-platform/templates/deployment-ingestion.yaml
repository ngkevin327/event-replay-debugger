{{- if .Values.ingestion.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ingestion
  labels:
    app.kubernetes.io/component: ingestion
spec:
  replicas: {{ .Values.ingestion.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: ingestion
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ingestion
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: ingestion
          image: {{ include "replay-platform.image" (dict "Values" .Values "repository" .Values.ingestion.image.repository "tag" .Values.ingestion.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: HTTP_ADDR
              value: ":8081"
          resources:
            {{- toYaml .Values.ingestion.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ingestion
spec:
  selector:
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 8081
      targetPort: http
{{- end }}
