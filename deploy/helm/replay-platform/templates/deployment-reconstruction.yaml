{{- if .Values.reconstruction.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-reconstruction
  labels:
    app.kubernetes.io/component: reconstruction
spec:
  replicas: {{ .Values.reconstruction.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: reconstruction
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: reconstruction
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: reconstruction
          image: {{ include "replay-platform.image" (dict "Values" .Values "repository" .Values.reconstruction.image.repository "tag" .Values.reconstruction.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: WORKER_QUEUE_URL
              value: redis://replay-redis:6379
          resources:
            {{- toYaml .Values.reconstruction.resources | nindent 12 }}
{{- end }}
